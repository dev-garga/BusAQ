<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bus AQ</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="stile.css">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- Barra di stato opaca: con 'black-translucent' il contenuto le scorre sotto e iOS
     la disegna con un materiale sfocato, che sbavava sopra il logo e il titolo. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Bus AQ">
</head>
<body>

<header>
  <svg class="logo" viewBox="0 0 100 100" aria-hidden="true">
    <path d="M29.3 71.3 C 29.3 42 70.7 58.6 70.7 29.3" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
    <circle cx="29.3" cy="71.3" r="7.5" fill="none" stroke="currentColor" stroke-width="3.8"/>
    <circle cx="70.7" cy="29.3" r="7.5" fill="none" stroke="currentColor" stroke-width="3.8"/>
  </svg>
  <div class="title">Bus AQ</div>
  <div class="clock" id="clock">--:--</div>
</header>

<div class="route">
  <div class="route-rail"><i class="from"></i><span></span><i></i></div>
  <div class="route-fields">
    <button class="field" id="f-origin"><span class="lab">Partenza</span><span class="val" id="v-origin">&mdash;</span></button>
    <div class="route-sep"></div>
    <button class="field" id="f-dest"><span class="lab">Arrivo</span><span class="val" id="v-dest">&mdash;</span></button>
  </div>
  <button class="swap" id="swap" aria-label="Inverti partenza e arrivo">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 4v15M7 19l-3.2-3.4M7 19l3.2-3.4M17 20V5M17 5l3.2 3.4M17 5l-3.2 3.4"/>
    </svg>
  </button>
</div>

<div class="preferite" id="preferite"></div>

<div class="days" id="days">
  <button class="day on" data-day="oggi">Oggi</button>
  <button class="day" data-day="domani">Domani</button>
</div>

<div class="banner" id="banner"><span id="banner-text"></span><button id="banner-btn">Tutte le corse</button></div>

<div class="cards" id="cards"><div class="empty">Caricamento orari&hellip;</div></div>
<div class="foot" id="foot"></div>

<div class="sheet-bg" id="sheet-bg">
  <div class="sheet">
    <div class="grip"></div>
    <h3 id="sheet-title">Fermata</h3>
    <div id="sheet-opts"></div>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
