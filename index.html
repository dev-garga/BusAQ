<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bus AQ</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="stile.css">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="theme-color" content="#f28c1c" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14110c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- 'black-translucent' e' la configurazione in cui iOS riporta davvero
     env(safe-area-inset-top). Lo spazio sotto la barra lo tiene il riempimento di body,
     in stile.css. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bus AQ">
</head>
<body>

<header class="testata">
  <img class="segno" src="logo.svg" alt="" width="38" height="38">
  <h1>Bus AQ</h1>
  <div class="clock" id="clock">--:--</div>
</header>

<section class="tratta">
  <div class="campi">
    <button class="campo" id="f-origin"><span class="lab">Da</span><span class="val" id="v-origin">&mdash;</span></button>
    <button class="campo" id="f-dest"><span class="lab">A</span><span class="val" id="v-dest">&mdash;</span></button>
  </div>
  <button class="swap" id="swap" aria-label="Inverti partenza e arrivo">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true">
      <path d="M7 3v17M7 20l-4-4M7 20l4-4M17 21V4M17 4l-4 4M17 4l4 4"/>
    </svg>
  </button>
</section>

<div class="preferite" id="preferite"></div>

<div class="days" id="days">
  <button class="day on" data-day="oggi">Oggi</button>
  <button class="day" data-day="domani">Domani</button>
</div>

<div class="banner" id="banner"><span id="banner-text"></span><button id="banner-btn">Tutte le corse</button></div>

<main class="cards" id="cards"><div class="empty">Caricamento orari&hellip;</div></main>
<footer class="foot" id="foot"></footer>

<div class="sheet-bg" id="sheet-bg">
  <div class="sheet">
    <div class="grip"></div>
    <h2 id="sheet-title">Fermata</h2>
    <div id="sheet-opts"></div>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
